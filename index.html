
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>InkAura Books | Where Possibilities Grow</title>
  <style>
    body {
      margin: 0;
      background: #fffdf9;
      color: #30291f;
      font-family: Georgia, serif;
    }
    header {
      padding: 25px 15px;
      text-align: center;
      background: white;
      border-bottom: 1px solid #e9ddc5;
    }
    h1 {
      color: #a98443;
      margin: 0;
    }
    header p {
      color: #88754f;
      letter-spacing: 2px;
      font-size: 11px;
    }
    main {
      padding: 45px 20px;
      text-align: center;
    }
    h2 {
      font-size: 34px;
      font-weight: normal;
    }
    .intro {
      color: #777064;
      line-height: 1.7;
    }
    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 24px;
      background: #a98443;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    .categories {
      padding: 25px 15px;
      background: #f6f1e7;
    }
    .category {
      background: white;
      padding: 18px;
      margin: 12px 0;
      border: 1px solid #e9ddc5;
      border-radius: 6px;
    }
    footer {
      padding: 25px;
      text-align: center;
      color: #88754f;
    }
  </style>
</head>
<body>
  <header>
    <h1>InkAura Books</h1>
    <p>WHERE POSSIBILITIES GROW</p>
  </header>

  <main>
    <h2>Discover a world of possibilities.</h2>
    <p class="intro">
      Stories, knowledge and creativity,
      all in one place.
    </p>
    <a class="button" href="#categories">
      Explore our books
    </a>
  </main>

  <section class="categories" id="categories">
    <h2>Our Collections</h2>
    <div class="category">Bible Storybooks</div>
    <div class="category">Colouring & Activities</div>
    <div class="category">Educational Books</div>
    <div class="category">Creative Stories</div>
  </section>

  <footer>
    InkAura Books © 2026
    <p>Where possibilities grow.</p>
  </footer>
</body>
</html>
